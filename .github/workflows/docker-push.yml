name: Docker Push

on:
  workflow_call:
    inputs:
      image-ref:
        description: Ephemeral GHCR image ref produced by the build job
        required: true
        type: string
      image-tags:
        description: Final GHCR tags to publish
        required: true
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          set -euo pipefail
          docker pull "${{ inputs.image-ref }}"
          docker tag "${{ inputs.image-ref }}" recyclerie:ci

      - name: Push final tags
        run: |
          set -euo pipefail
          mapfile -t tags <<< "${{ inputs.image-tags }}"
          for tag in "${tags[@]}"; do
            [ -z "${tag}" ] && continue
            docker tag recyclerie:ci "${tag}"
            docker push "${tag}"
          done
