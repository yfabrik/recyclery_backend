name: Docker Build

on:
  workflow_call:
    outputs:
      image-ref:
        description: Ephemeral GHCR tag for the built image
        value: ${{ jobs.build.outputs.image-ref }}
      image-tags:
        description: GHCR tags for the built image
        value: ${{ jobs.build.outputs.image-tags }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.ci-tag.outputs.image-ref }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set CI image ref
        id: ci-tag
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image-ref=ghcr.io/${repo}:ci-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ci-tag.outputs.image-ref }}
          labels: ${{ steps.meta.outputs.labels }}

