name: Docker Image CI

on:
  push:
    branches: ["with-imports"]
    paths: &docker-paths
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "config/**"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/docker-health.yml"
      - ".github/workflows/docker-push.yml"
  pull_request:
    paths: *docker-paths
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read

  health:
    needs: build
    uses: ./.github/workflows/docker-health.yml
    permissions:
      contents: read

  push:
    needs:
      - build
      - health
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-push.yml
    permissions:
      packages: write
      contents: read
    secrets: inherit
    with:
      image-tags: ${{ needs.build.outputs.image-tags }}
